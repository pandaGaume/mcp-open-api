name: ci

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "npm"
            - run: npm ci
            - run: npm run format
            - run: npm run build
            # Loads the built entries with plain Node: vitest resolves imports Node's ESM loader refuses.
            - run: npm run smoke
            # Type-checks the test files too, which `build` skips and vitest never verifies.
            - run: npm run typecheck
            - run: npm test
